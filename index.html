<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>さんすう れんしゅう</title>
  <meta name="theme-color" content="#ff8a3d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="さんすう">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- だれが やる？ -->
  <section id="who" class="screen active">
    <h1>だれが やる？</h1>
    <div id="who-list" class="who-list"></div>
    <button id="who-add" class="small-btn who-add">＋ こどもを ふやす</button>
    <div id="storage-warning" class="storage-warning" hidden>
      ⚠️ このブラウザでは記録が保存できません。保護者メニューを確認してください。
    </div>
    <button id="settings-btn" class="settings-btn">⚙️ 保護者メニュー（記録の確認・バックアップ）</button>
  </section>

  <!-- ホーム：レベルをえらぶ -->
  <section id="home" class="screen">
    <div id="home-bar" class="home-bar"></div>
    <h1>さんすう れんしゅう</h1>
    <div id="level-groups"></div>
  </section>

  <!-- もんだい -->
  <section id="quiz" class="screen">
    <header class="quiz-bar">
      <button id="quit" class="small-btn" aria-label="やめる">✕ やめる</button>
      <div id="progress" class="progress"></div>
      <div id="timer" class="timer">0:00</div>
    </header>

    <div class="quiz-body">
      <div class="left">
        <div id="formula" class="formula"></div>
        <div id="visual" class="visual"></div>
        <div class="visual-tools">
          <button id="merge-btn" class="tool-btn">🧲 がっちゃん</button>
          <button id="count-btn" class="tool-btn">👆 かぞえる</button>
          <button id="hide-btn" class="tool-btn">🙈 えを かくす</button>
        </div>
      </div>
      <div class="right">
        <div id="side" class="side"></div>
        <div id="message" class="message"></div>
        <div id="keypad" class="keypad"></div>
      </div>
    </div>

    <div id="judge" class="judge"></div>
  </section>

  <!-- くく タイムアタック -->
  <section id="ta" class="screen">
    <header class="quiz-bar">
      <button id="ta-quit" class="small-btn">✕ やめる</button>
      <div class="ta-bar"><div id="ta-fill" class="ta-fill"></div></div>
      <div id="ta-time" class="timer ta-time">150</div>
    </header>
    <div class="quiz-body">
      <div class="left ta-left">
        <div id="ta-score" class="ta-score"></div>
        <div id="ta-formula" class="formula"></div>
        <button id="ta-start" class="big-btn orange ta-start">よーい スタート！</button>
      </div>
      <div class="right">
        <div id="ta-keypad" class="keypad"></div>
      </div>
    </div>
  </section>

  <!-- むしの おへや -->
  <section id="pets" class="screen">
    <header class="quiz-bar">
      <button id="pets-back" class="small-btn">← もどる</button>
      <div class="pets-title">🐜 <span id="pets-who"></span> の むしの おへや</div>
      <div id="pets-points" class="points-chip"></div>
    </header>
    <div id="case-tabs" class="case-tabs"></div>
    <div class="pets-body">
      <div id="room3d" class="room3d"><div id="room-msg" class="room-msg"></div><button class="expand-btn" data-screen="pets">⛶ おおきく</button></div>
      <div class="pets-side">
        <div id="pet-info" class="pet-info"></div>
        <div class="pets-actions">
          <button id="feed-btn" class="big-btn orange">🍯 えさを あげる</button>
          <button id="shop-btn" class="big-btn blue">🛒 おみせ</button>
          <button id="zukan-btn" class="big-btn green wide">📖 ずかん</button>
        </div>
        <div id="inventory" class="inventory"></div>
      </div>
    </div>
  </section>

  <!-- さかなの おへや -->
  <section id="fish" class="screen">
    <header class="quiz-bar">
      <button id="fish-back" class="small-btn">← もどる</button>
      <div class="pets-title">🐟 <span id="fish-who"></span> の さかなの おへや</div>
      <div id="fish-points" class="points-chip"></div>
    </header>
    <div id="tank-tabs" class="case-tabs"></div>
    <div class="pets-body">
      <div id="tank3d" class="room3d tank3d"><div id="tank-msg" class="room-msg"></div><button class="expand-btn" data-screen="fish">⛶ おおきく</button></div>
      <div class="pets-side">
        <div id="fish-info" class="pet-info"></div>
        <div class="pets-actions">
          <button id="ffeed-btn" class="big-btn orange">🍤 えさを あげる</button>
          <button id="water-btn" class="big-btn blue">💧 みずかえ</button>
          <button id="fshop-btn" class="big-btn green">🛒 おみせ</button>
          <button id="fzukan-btn" class="big-btn purple">📖 ずかん</button>
        </div>
        <div id="finventory" class="inventory"></div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <div id="fshop" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-head">
        <b>🛒 さかなの おみせ</b>
        <span id="fshop-points" class="points-chip"></span>
        <button id="fshop-close" class="small-btn">とじる</button>
      </div>
      <div class="shop-tabs">
        <button class="shop-tab fshop-tab" data-tab="fish">さかな</button>
        <button class="shop-tab fshop-tab" data-tab="tank">すいそう</button>
        <button class="shop-tab fshop-tab" data-tab="equip">きぐ</button>
        <button class="shop-tab fshop-tab" data-tab="decor">おきもの</button>
        <button class="shop-tab fshop-tab" data-tab="food">えさ・くすり</button>
      </div>
      <div id="fshop-list" class="shop-list"></div>
    </div>
  </div>

  <div id="fzukan" class="overlay hidden">
    <div class="sheet wide">
      <div class="sheet-head">
        <b>📖 さかなの ずかん</b>
        <span id="fzukan-count" class="zukan-count"></span>
        <button id="fzukan-close" class="small-btn">とじる</button>
      </div>
      <div class="zukan-body">
        <div id="fzukan-grid" class="zukan-grid"></div>
        <div id="fzukan-detail" class="zukan-detail"></div>
      </div>
    </div>
  </div>

  <div id="shop" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-head">
        <b>🛒 おみせ</b>
        <span id="shop-points" class="points-chip"></span>
        <button id="shop-close" class="small-btn">とじる</button>
      </div>
      <div class="shop-tabs">
        <button class="shop-tab" data-tab="bug">むし</button>
        <button class="shop-tab" data-tab="case">ケース</button>
        <button class="shop-tab" data-tab="decor">おきもの</button>
        <button class="shop-tab" data-tab="food">えさ</button>
      </div>
      <div id="shop-list" class="shop-list"></div>
    </div>
  </div>

  <div id="zukan" class="overlay hidden">
    <div class="sheet wide">
      <div class="sheet-head">
        <b>📖 むしの ずかん</b>
        <span id="zukan-count" class="zukan-count"></span>
        <button id="zukan-close" class="small-btn">とじる</button>
      </div>
      <div class="zukan-body">
        <div id="zukan-grid" class="zukan-grid"></div>
        <div id="zukan-detail" class="zukan-detail"></div>
      </div>
    </div>
  </div>

  <div id="settings" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-head">
        <b>⚙️ 保護者メニュー</b>
        <button id="settings-close" class="small-btn">とじる</button>
      </div>
      <div id="settings-body" class="settings-body"></div>
    </div>
  </div>

  <div id="notice" class="overlay hidden">
    <div class="dialog">
      <div id="notice-text" class="dialog-text notice-text"></div>
      <button id="notice-ok" class="big-btn orange">OK</button>
    </div>
  </div>

  <div id="confirm" class="overlay hidden">
    <div class="dialog">
      <div id="confirm-text" class="dialog-text"></div>
      <div class="dialog-buttons">
        <button id="confirm-no" class="big-btn gray">やめる</button>
        <button id="confirm-yes" class="big-btn orange">かう！</button>
      </div>
    </div>
  </div>

  <!-- けっか -->
  <section id="result" class="screen">
    <div id="result-mark" class="result-mark"></div>
    <div id="result-text" class="result-text"></div>
    <div id="result-wrong" class="result-wrong"></div>
    <div id="result-points" class="result-points"></div>
    <div id="result-extra"></div>
    <div class="result-buttons">
      <button id="retry-wrong" class="big-btn orange">まちがえた もんだいを もういちど</button>
      <button id="retry-all" class="big-btn blue">もういちど</button>
      <button id="go-home" class="big-btn gray">もどる</button>
    </div>
  </section>

  <script src="rewards.js"></script>
  <script src="problems.js"></script>
  <script src="tiles.js"></script>
  <script src="board.js"></script>
  <script src="placevalue.js"></script>
  <script src="kukuhyo.js"></script>
  <script src="kufu.js"></script>
  <script src="nagasa.js"></script>
  <script src="junjo.js"></script>
  <script src="pazuru.js"></script>
  <script src="suiri.js"></script>
  <script src="kakezan.js"></script>
  <script src="tenkai.js"></script>
  <script src="zenhan1.js"></script>
  <script src="zenhan2.js"></script>
  <script src="zenhan3.js"></script>
  <script src="ichinen1.js"></script>
  <script src="ichinen2.js"></script>
  <script src="app.js"></script>
  <script src="timeattack.js"></script>
  <script src="flatroom.js"></script>
  <script src="pets.js"></script>
  <script src="fish.js"></script>
  <script src="settings.js"></script>
</body>
</html>
